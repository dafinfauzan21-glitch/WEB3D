name: Deploy Vite Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WEB3D/JAWAA/package-lock.json

      - name: Install dependencies
        working-directory: WEB3D/JAWAA
        run: npm ci

      - name: Build website
        working-directory: WEB3D/JAWAA
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: WEB3D/JAWAA/dist

      - name: Deploy website
        uses: actions/deploy-pages@v4
